# NSE Stock Analyzer — run everything with:   docker compose up -d --build
# Then open http://localhost:8080   (API docs: http://localhost:8000/docs)
#
# DATA IS STORED ON YOUR COMPUTER, NOT INSIDE DOCKER: the folder ~/nse-analyzer-data
# (or NSE_DATA_HOST_DIR from a .env file next to this one) is mounted into the backend
# as /data. It survives `docker compose down`, rebuilds and new versions of the app, and
# it's the same folder the non-Docker version uses. Back it up by copying that folder.

services:
  backend:
    build: ./backend
    image: nse-analyzer-backend
    restart: unless-stopped
    environment:
      # the app runs as this user so files in ~/nse-analyzer-data stay editable outside Docker
      # (the entrypoint fixes the folder's ownership first, e.g. if Docker created it as root)
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      NSE_DATA_DIR: /data
      # shown in the app header so you can see where the data really lives on your computer
      NSE_DATA_DIR_ON_HOST: "${NSE_DATA_HOST_DIR:-~/nse-analyzer-data}"
      HOME: /data/.home            # embedding-model cache persists across restarts
      TZ: Asia/Kolkata
      AUTO_SYNC: "${AUTO_SYNC:-true}"
      AUTO_SYNC_TIME: "${AUTO_SYNC_TIME:-18:45}"
      AUTO_SYNC_ON_START: "${AUTO_SYNC_ON_START:-true}"
      AUTO_BRIEFING: "${AUTO_BRIEFING:-true}"
      BRIEFING_TIME: "${BRIEFING_TIME:-08:15}"
      WEEKLY_TIME: "${WEEKLY_TIME:-09:00}"
    volumes:
      # <folder on your computer>:<path inside the container>
      - ${NSE_DATA_HOST_DIR:-~/nse-analyzer-data}:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: nse-analyzer-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
